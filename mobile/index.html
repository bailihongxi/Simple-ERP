<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="进销存">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./css/style.css">
    <title>进销存</title>
</head>
<body>
    <!-- 顶部栏 -->
    <header class="topbar" id="topbar">
        <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none;">
            <span class="back-icon">‹</span>
        </button>
        <h1 class="topbar-title" id="topbarTitle">进销存</h1>
        <button class="settings-btn" id="settingsBtn" onclick="goToSettings()">
            <span class="settings-icon">⚙️</span>
        </button>
    </header>

    <!-- 内容区 -->
    <main class="content">
        <!-- 首页 -->
        <section id="page-home" class="page active">
            <div class="search-section">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜索商品名称..." oninput="handleSearch()">
                </div>
            </div>

            <div class="search-results" id="searchResults">
                <div class="empty-state">
                    <div class="empty-icon">🔍</div>
                    <div class="empty-text">输入关键词搜索产品</div>
                </div>
            </div>
        </section>

        <!-- 产品页 -->
        <section id="page-products" class="page">
            <div class="page-content">
                <div class="filter-bar">
                    <div class="filter-row">
                        <select class="filter-select" id="productBrand">
                            <option value="">全部品牌</option>
                        </select>
                        <select class="filter-select" id="productCategory">
                            <option value="">全部分类</option>
                        </select>
                    </div>
                    <div class="filter-row">
                        <button class="btn btn-primary" style="flex:1" onclick="filterProducts()">筛选</button>
                        <button class="btn btn-secondary" style="flex:1" onclick="resetProductFilter()">重置</button>
                    </div>
                </div>

                <div id="productList" class="list-container">
                    <div class="empty-state">
                        <div class="empty-icon">📦</div>
                        <div class="empty-text">暂无产品数据</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 销售页 -->
        <section id="page-sales" class="page">
            <div class="page-content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">销售笔数</div>
                        <div class="stat-value blue" id="saleCount">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">销售总金额</div>
                        <div class="stat-value" id="saleTotal">¥0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">总毛利</div>
                        <div class="stat-value green" id="saleProfit">¥0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">总成本</div>
                        <div class="stat-value" id="saleCost">¥0.00</div>
                    </div>
                </div>

                <div class="filter-bar">
                    <div class="filter-row">
                        <input type="date" class="filter-input" id="saleDateStart">
                        <input type="date" class="filter-input" id="saleDateEnd">
                    </div>
                    <div class="filter-row">
                        <input type="text" class="filter-input" id="saleKeyword" placeholder="搜索商品/客户">
                    </div>
                    <div class="filter-row">
                        <button class="btn btn-primary" style="flex:1" onclick="filterSales()">筛选</button>
                        <button class="btn btn-secondary" style="flex:1" onclick="resetSaleFilter()">重置</button>
                    </div>
                </div>

                <div id="salesList" class="list-container">
                    <div class="empty-state">
                        <div class="empty-icon">📤</div>
                        <div class="empty-text">暂无销售记录</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 库存页 -->
        <section id="page-inventory" class="page">
            <div class="page-content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">商品种类</div>
                        <div class="stat-value blue" id="invTotalProducts">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">库存总数量</div>
                        <div class="stat-value" id="invTotalStock">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">库存总价值</div>
                        <div class="stat-value green" id="invTotalValue">¥0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">低库存预警</div>
                        <div class="stat-value red" id="invLowStock">0</div>
                    </div>
                </div>

                <div class="filter-bar">
                    <div class="filter-row">
                        <input type="text" class="filter-input" id="invKeyword" placeholder="搜索商品名称">
                    </div>
                    <div class="filter-row">
                        <select class="filter-select" id="invBrand">
                            <option value="">全部品牌</option>
                        </select>
                        <select class="filter-select" id="invCategory">
                            <option value="">全部分类</option>
                        </select>
                    </div>
                    <div class="filter-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="invLowOnly"> 只看低库存
                        </label>
                    </div>
                    <div class="filter-row">
                        <button class="btn btn-primary" style="flex:1" onclick="filterInventory()">筛选</button>
                        <button class="btn btn-secondary" style="flex:1" onclick="resetInventoryFilter()">重置</button>
                    </div>
                </div>

                <div id="inventoryList" class="list-container">
                    <div class="empty-state">
                        <div class="empty-icon">📊</div>
                        <div class="empty-text">暂无库存数据</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 采购页 -->
        <section id="page-purchase" class="page">
            <div class="page-content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">采购笔数</div>
                        <div class="stat-value blue" id="purCount">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">采购总金额</div>
                        <div class="stat-value" id="purTotal">¥0.00</div>
                    </div>
                </div>

                <div class="filter-bar">
                    <div class="filter-row">
                        <input type="date" class="filter-input" id="purDateStart">
                        <input type="date" class="filter-input" id="purDateEnd">
                    </div>
                    <div class="filter-row">
                        <input type="text" class="filter-input" id="purKeyword" placeholder="搜索商品/供应商">
                    </div>
                    <div class="filter-row">
                        <button class="btn btn-primary" style="flex:1" onclick="filterPurchases()">筛选</button>
                        <button class="btn btn-secondary" style="flex:1" onclick="resetPurchaseFilter()">重置</button>
                    </div>
                </div>

                <div id="purchaseList" class="list-container">
                    <div class="empty-state">
                        <div class="empty-icon">📥</div>
                        <div class="empty-text">暂无采购记录</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 我的/设置页 -->
        <section id="page-mine" class="page">
            <div class="page-content">
                <div class="card">
                    <div class="card-title">数据概览</div>
                    <div id="dataSummary">
                        <div class="empty-state">
                            <div class="empty-icon">📦</div>
                            <div class="empty-text">暂无数据，请先导入数据</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">快捷入口</div>
                    <div style="padding:4px 0;">
                        <button class="btn btn-secondary" style="width:100%;padding:14px;text-align:left;justify-content:flex-start;" onclick="goToPurchase()">
                            <span style="margin-right:8px;">📥</span> 采购记录
                        </button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">数据管理</div>
                    <div style="padding:8px 0;">
                        <button class="btn btn-primary" style="width:100%;padding:14px;margin-bottom:12px;" onclick="triggerImport()">导入数据</button>
                        <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
                        <button class="btn btn-warning" style="width:100%;padding:14px;" onclick="clearAllData()">清除所有数据</button>
                    </div>
                    <div style="font-size:12px;color:#94a3b8;margin-top:8px;">
                        数据保存在手机浏览器本地，清除后不可恢复
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">关于</div>
                    <div style="font-size:13px;color:#64748b;line-height:1.8;">
                        <p>进销存管理系统 - 手机版</p>
                        <p>版本：v1.0</p>
                        <p>数据保存在手机浏览器本地，离线可用。</p>
                        <p>所有数据仅存储在您的设备上，不会上传到任何服务器。</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 底部导航 -->
    <nav class="tabbar">
        <div class="tab-item active" data-tab="home" onclick="switchTab('home')">
            <div class="tab-icon">🏠</div>
            <div class="tab-text">首页</div>
        </div>
        <div class="tab-item" data-tab="products" onclick="switchTab('products')">
            <div class="tab-icon">📦</div>
            <div class="tab-text">产品</div>
        </div>
        <div class="tab-item" data-tab="sales" onclick="switchTab('sales')">
            <div class="tab-icon">📤</div>
            <div class="tab-text">销售</div>
        </div>
    </nav>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-title" id="modalTitle">提示</div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" id="modalConfirmBtn">确定</button>
            </div>
        </div>
    </div>

    <script src="./js/storage.js"></script>
    <script src="./js/app.js"></script>
    <script>
        // 注册 Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js').then(function(registration) {
                    console.log('ServiceWorker registration successful');
                }).catch(function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
