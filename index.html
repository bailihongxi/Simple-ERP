<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进销存管理系统</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            max-width: 400px;
        }
        h1 {
            color: #1e293b;
            margin-bottom: 16px;
            font-size: 24px;
        }
        p {
            color: #64748b;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #3b82f6;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background: #f1f5f9;
            color: #475569;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 进销存管理系统</h1>
        <p>Simple-ERP 个人进销存管理系统</p>
        <p>
            <a href="./mobile/" class="btn">📱 手机版</a>
        </p>
        <p style="margin-top: 20px; font-size: 12px; color: #94a3b8;">
            电脑端请在本地运行 Flask 服务
        </p>
    </div>
</body>
</html>
